<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Game | Snakefield</title>
<style>
  :root { color-scheme: dark; --bg:#050f20; --panel:#07172b; --line:#15345b; --blue:#1457ad; --green:#35eca0; --text:#f4f8ff; --muted:#a9c3e3; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(ellipse at top,#0b1d34 0%,var(--bg) 62%); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; justify-content:center; padding:24px 16px; }
  .app { width:min(100%,1000px); }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:13px; }
  .logo { font-size:42px; line-height:1; }
  h1 { font-size:clamp(25px,4vw,38px); letter-spacing:-1.4px; margin:0; }
  h1 span { color:var(--green); }
  .tagline { color:var(--muted); margin-top:3px; font-size:14px; }
  .stats { min-width:205px; padding:12px 18px; border:1px solid #17457b; background:#061326b8; border-radius:17px; text-align:center; }
  .stage { font-size:21px; font-weight:750; }
  .progress { height:8px; background:#203b60; border-radius:20px; overflow:hidden; margin:9px 0 7px; }
  .progress > div { height:100%; width:0%; background:linear-gradient(90deg,#26d992,#56f6b3); border-radius:20px; transition:width .15s; }
  .count { color:var(--muted); font-size:14px; }
  .actions { display:flex; gap:10px; }
  button { color:var(--text); background:#0a1b31; border:1px solid #204b7e; border-radius:12px; padding:10px 14px; font:inherit; font-weight:650; cursor:pointer; transition:background .15s,border-color .15s,transform .15s; }
  button:hover { background:#10294a; border-color:#3b79bd; }
  button:active { transform:scale(.97); }
  .iconbtn { font-size:21px; min-width:54px; height:52px; }
  .board-wrap { padding:6px; border:2px solid #1553a8; background:#06152a; border-radius:23px; box-shadow:0 0 0 1px #0a2446,0 18px 50px #0004; position:relative; }
  canvas { width:100%; display:block; aspect-ratio:1; border-radius:15px; touch-action:none; }
  .overlay { position:absolute; inset:6px; display:none; align-items:center; justify-content:center; border-radius:17px; background:#031021bd; backdrop-filter:blur(5px); text-align:center; padding:20px; }
  .overlay.show { display:flex; }
  .overlay-card { background:#07172a; border:1px solid #214c7d; padding:25px; border-radius:18px; max-width:340px; }
  .overlay h2 { margin:0 0 8px; font-size:27px; }
  .overlay p { color:var(--muted); margin:0 0 17px; }
  .controls { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding:13px 16px; border:1px solid #17385f; background:#061326a8; border-radius:17px; margin:18px 8px 0; color:var(--muted); font-size:14px; }
  .keyset { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .key { display:inline-grid; place-items:center; min-width:37px; height:37px; padding:0 9px; border:1px solid #315e91; border-radius:9px; color:white; background:#0a1a30; font-weight:750; }
  .touch-controls { display:none; grid-template-columns:repeat(3,52px); grid-template-rows:repeat(2,48px); gap:6px; justify-content:center; margin:16px auto 0; }
  .touch-controls button { padding:0; font-size:21px; }
  .touch-controls .up { grid-column:2; } .touch-controls .left { grid-column:1; grid-row:2; } .touch-controls .down { grid-column:2; grid-row:2; } .touch-controls .right { grid-column:3; grid-row:2; }
  .hint { text-align:center; color:#7897bc; font-size:12px; margin:13px 0 0; }
  @media(max-width:650px) {
    body { padding:15px 10px; }
    header { justify-content:center; }
    .brand { margin-right:auto; }
    .stats { order:3; width:100%; }
    .actions { margin-left:auto; }
    .controls { justify-content:center; }
    .touch-controls { display:grid; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">🍎</div>
      <div><h1>Snake<span>field</span></h1><div class="tagline">The little apple game</div></div>
    </div>
    <section class="stats" aria-live="polite">
      <div class="stage" id="stageLabel">Stage 1</div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="count" id="countLabel">0 / 80 squares</div>
    </section>
    <div class="actions">
      <button class="iconbtn" id="soundBtn" title="Toggle sound" aria-label="Toggle sound">🔊</button>
      <button class="iconbtn" id="fullBtn" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button>
    </div>
  </header>

  <section class="board-wrap" id="boardWrap">
    <canvas id="game" width="800" height="800" aria-label="Snake game board"></canvas>
    <div class="overlay show" id="overlay">
      <div class="overlay-card">
        <h2 id="overlayTitle">Ready to play?</h2>
        <p id="overlayText">Eat apples, grow your snake, and reach 80 squares to unlock Stage 2.</p>
        <button id="startBtn">Start game</button>
      </div>
    </div>
  </section>

  <div class="touch-controls" aria-label="Touch movement controls">
    <button class="up" data-dir="up" aria-label="Move up">↑</button>
    <button class="left" data-dir="left" aria-label="Move left">←</button>
    <button class="down" data-dir="down" aria-label="Move down">↓</button>
    <button class="right" data-dir="right" aria-label="Move right">→</button>
  </div>

  <div class="controls">
    <div class="keyset"><span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span><span>Move</span></div>
    <div class="keyset"><span class="key">SPACE</span><span>Pause</span></div>
    <div class="keyset"><span class="key">R</span><span>Restart</span></div>
  </div>
  <p class="hint">Tip: use arrow keys or WASD. On mobile, use the direction buttons.</p>
</main>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const N = 40, CELL = canvas.width / N, TARGET = 80;
  const stageLabel = document.getElementById('stageLabel');
  const countLabel = document.getElementById('countLabel');
  const progressBar = document.getElementById('progressBar');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  let snake, dir, nextDir, apple, stage, running, paused, gameOver, timer, soundOn = true, audioCtx;
  let score = 0;

  function reset() {
    clearTimeout(timer);
    snake = [];
    for (let i=0;i<5;i++) snake.push({x:17+i,y:20});
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    stage = 1; score = 0; running = false; paused = false; gameOver = false;
    spawnApple(); updateStats(); draw();
    showOverlay('Ready to play?', 'Eat apples, grow your snake, and reach 80 squares to unlock Stage 2.', 'Start game');
  }
  function showOverlay(title, text, button) {
    overlayTitle.textContent = title; overlayText.textContent = text; startBtn.textContent = button; overlay.classList.add('show');
  }
  function hideOverlay(){ overlay.classList.remove('show'); }
  function spawnApple() {
    let p, tries=0;
    do { p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}; tries++; }
    while(snake.some(s=>s.x===p.x&&s.y===p.y) && tries<2000);
    apple=p;
  }
  function updateStats() {
    stageLabel.textContent = 'Stage ' + stage;
    countLabel.textContent = `${snake.length} / ${TARGET} squares`;
    progressBar.style.width = Math.min(100, snake.length/TARGET*100) + '%';
  }
  function beep(freq=600, duration=.06) {
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
      osc.frequency.value=freq; osc.type='sine'; gain.gain.value=.035;
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+duration);
    } catch(e) {}
  }
  function start() {
    if (gameOver) reset();
    running=true; paused=false; hideOverlay(); schedule();
  }
  function schedule() {
    clearTimeout(timer);
    if (running && !paused && !gameOver) timer=setTimeout(tick, Math.max(55,125-(stage-1)*12));
  }
  function tick() {
    dir=nextDir;
    const head={x:snake[snake.length-1].x+dir.x,y:snake[snake.length-1].y+dir.y};
    const eating=head.x===apple.x && head.y===apple.y;
    const bodyToCheck=eating?snake:snake.slice(1);
    if(head.x<0||head.y<0||head.x>=N||head.y>=N||bodyToCheck.some(s=>s.x===head.x&&s.y===head.y)) {
      running=false; gameOver=true; beep(180,.2);
      showOverlay('Run complete', `You reached ${snake.length} squares and scored ${score} points.`, 'Play again');
      return;
    }
    snake.push(head);
    if(!eating) snake.shift();
    else {
      score+=10; beep(760,.055); spawnApple();
      if(snake.length>=TARGET && stage===1) {
        stage=2; beep(960,.18);
        showOverlay('Stage 2 unlocked!', 'Amazing! Your snake reached 80 squares. Stage 2 is faster now.', 'Continue');
        running=false; updateStats(); draw(); return;
      }
    }
    updateStats(); draw(); schedule();
  }
  function setDirection(d) {
    const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
    const nd=dirs[d]; if(!nd) return;
    if(nd.x===-dir.x && nd.y===-dir.y) return;
    nextDir=nd;
    if(!running && !gameOver && !paused) start();
  }
  function draw() {
    const w=canvas.width, h=canvas.height;
    ctx.clearRect(0,0,w,h);
    const bg=ctx.createLinearGradient(0,0,w,h); bg.addColorStop(0,'#06172b'); bg.addColorStop(1,'#041124');
    ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(37,83,133,.30)'; ctx.lineWidth=1;
    for(let i=0;i<=N;i++){let p=i*CELL;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(w,p);ctx.stroke();}
    drawApple(apple.x*CELL+CELL/2,apple.y*CELL+CELL/2);
    // A single continuous path with rounded joins makes the snake smooth and gap-free.
    ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=CELL*.82;
    ctx.shadowColor='#31efa0'; ctx.shadowBlur=13;
    const green=ctx.createLinearGradient(0,0,w,h); green.addColorStop(0,'#27d98d'); green.addColorStop(1,'#55f7b0');
    ctx.strokeStyle=green; ctx.beginPath();
    snake.forEach((s,i)=>{const x=s.x*CELL+CELL/2,y=s.y*CELL+CELL/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
    ctx.stroke(); ctx.restore();
    const head=snake[snake.length-1], hx=head.x*CELL+CELL/2, hy=head.y*CELL+CELL/2;
    // Two small eyes on the head, placed according to direction.
    const eyeOffset=CELL*.18, eyeR=CELL*.065;
    ctx.fillStyle='#063321';
    let e1,e2;
    if(dir.x!==0){e1={x:hx+dir.x*CELL*.12,y:hy-CELL*.17};e2={x:hx+dir.x*CELL*.12,y:hy+CELL*.17};}
    else {e1={x:hx-CELL*.17,y:hy+dir.y*CELL*.12};e2={x:hx+CELL*.17,y:hy+dir.y*CELL*.12};}
    [e1,e2].forEach(e=>{ctx.beginPath();ctx.arc(e.x,e.y,eyeR,0,Math.PI*2);ctx.fill();});
  }
  function drawApple(x,y) {
    ctx.save(); ctx.translate(x,y);
    ctx.shadowColor='#ff3558'; ctx.shadowBlur=14;
    ctx.fillStyle='#ff3655'; ctx.beginPath(); ctx.arc(-CELL*.12,CELL*.02,CELL*.23,0,Math.PI*2); ctx.arc(CELL*.12,CELL*.02,CELL*.23,0,Math.PI*2); ctx.lineTo(0,CELL*.32); ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0; ctx.strokeStyle='#48e79a'; ctx.lineWidth=CELL*.07; ctx.beginPath(); ctx.moveTo(0,-CELL*.17); ctx.quadraticCurveTo(CELL*.02,-CELL*.32,CELL*.13,-CELL*.34); ctx.stroke();
    ctx.fillStyle='#45e99a'; ctx.beginPath(); ctx.ellipse(-CELL*.07,-CELL*.27,CELL*.14,CELL*.075,-.5,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  document.addEventListener('keydown',e=>{
    const key=e.key.toLowerCase();
    const map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};
    if(map[key]){e.preventDefault();setDirection(map[key]);}
    if(key===' '){e.preventDefault(); if(gameOver)return; if(!running){start();}else{paused=!paused;if(paused){clearTimeout(timer);running=false;showOverlay('Paused','Take your time. Press Continue when you are ready.','Continue');}else{running=true;hideOverlay();schedule();}}}
    if(key==='r')reset();
  });
  document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDirection(b.dataset.dir)));
  startBtn.addEventListener('click',()=>{if(gameOver)reset();start();});
  document.getElementById('soundBtn').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇';if(soundOn)beep();});
  document.getElementById('fullBtn').addEventListener('click',async()=>{
    const target=document.getElementById('boardWrap');
    try { if(!document.fullscreenElement) await target.requestFullscreen(); else await document.exitFullscreen(); } catch(e) {}
  });
  document.addEventListener('fullscreenchange',()=>{document.getElementById('fullBtn').textContent=document.fullscreenElement?'⤢':'⛶';});
  reset();
})();
</script>
</body>
</html>
